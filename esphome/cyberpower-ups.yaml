esphome:
  name: cyberpower-ups
  friendly_name: CyberPower UPS Monitor
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_USB_OTG_SUPPORTED: "y"
      CONFIG_USB_HOST_CONTROL_TRANSFER_MAX_SIZE: "1024"

# CyberPower UPS component from GitHub
external_components:
  - source:
      type: git
      url: https://github.com/ESDN83/esp-cyberpower-ups
      ref: master
    components: [cyberpower_ups]
    refresh: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  ap:
    ssid: "CyberPower-UPS"
    password: "upsmonitor123"

logger:
  level: DEBUG
  hardware_uart: UART0  # CRITICAL: USB_SERIAL_JTAG (default) blocks GPIO19/20 needed for USB host!

safe_mode:
  boot_is_good_after: 5s
  num_attempts: 20

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

# ── UPS Component ─────────────────────────────────────────────
cyberpower_ups:
  id: ups

# ── Sensors ───────────────────────────────────────────────────
# All values are read from the UPS via USB HID and exposed as
# native ESPHome sensors → appear automatically in Home Assistant.

sensor:
  - platform: template
    name: "Utility Voltage"
    id: utility_voltage
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      auto data = id(ups).get_data();
      if (!data.connected) return NAN;
      return data.utility_voltage;
    update_interval: 5s

  - platform: template
    name: "Output Voltage"
    id: output_voltage
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      auto data = id(ups).get_data();
      if (!data.connected) return NAN;
      return data.output_voltage;
    update_interval: 5s

  # Battery pack voltage, from the PowerSummary collection. On a 24 V
  # pack this reads around 25-27 V and barely moves while on mains.
  - platform: template
    name: "Battery Voltage"
    id: battery_voltage
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 1
    entity_category: diagnostic
    lambda: |-
      auto data = id(ups).get_data();
      if (!data.connected || data.battery_voltage <= 0) return NAN;
      return data.battery_voltage;
    update_interval: 5s

  - platform: template
    name: "Battery Capacity"
    id: battery_capacity
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      auto data = id(ups).get_data();
      if (!data.connected) return NAN;
      return data.battery_capacity;
    update_interval: 5s

  - platform: template
    name: "Remaining Runtime"
    id: remaining_runtime
    unit_of_measurement: "min"
    icon: "mdi:timer-outline"
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      auto data = id(ups).get_data();
      if (!data.connected) return NAN;
      return data.remaining_runtime_sec / 60.0f;
    update_interval: 5s

  # Percent load applies to the nameplate rating. Prefer the active
  # power rating (W) the UPS reports; fall back to apparent power (VA)
  # scaled by a typical power factor only if the UPS does not report it.
  - platform: template
    name: "Load"
    id: load_watt
    unit_of_measurement: "W"
    device_class: power
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      auto data = id(ups).get_data();
      if (!data.connected) return NAN;
      if (data.rating_power_w > 0)
        return data.load_percent / 100.0f * data.rating_power_w;
      if (data.rating_power_va > 0)
        return data.load_percent / 100.0f * data.rating_power_va * 0.6f;
      return NAN;
    update_interval: 5s

  - platform: template
    name: "Load Percent"
    id: load_percent
    unit_of_measurement: "%"
    icon: "mdi:gauge"
    state_class: measurement
    accuracy_decimals: 0
    lambda: |-
      auto data = id(ups).get_data();
      if (!data.connected) return NAN;
      return data.load_percent;
    update_interval: 5s

  - platform: template
    name: "Rating Power"
    id: rating_power
    unit_of_measurement: "VA"
    icon: "mdi:flash"
    entity_category: diagnostic
    accuracy_decimals: 0
    lambda: |-
      auto data = id(ups).get_data();
      if (!data.connected) return NAN;
      return data.rating_power_va;
    update_interval: 60s

  # Nameplate active power. NAN when the UPS does not report it — in
  # that case the Load sensor above falls back to the VA rating.
  - platform: template
    name: "Rating Power Active"
    id: rating_power_w
    unit_of_measurement: "W"
    icon: "mdi:flash"
    entity_category: diagnostic
    accuracy_decimals: 0
    lambda: |-
      auto data = id(ups).get_data();
      if (!data.connected || data.rating_power_w <= 0) return NAN;
      return data.rating_power_w;
    update_interval: 60s

  # Nominal *mains* voltage (230 V in Europe). If this shows something
  # like 24 V, the Input collection was not found and the reading came
  # from PowerSummary, i.e. the battery — please report it, see README.
  - platform: template
    name: "Rating Voltage"
    id: rating_voltage
    unit_of_measurement: "V"
    device_class: voltage
    entity_category: diagnostic
    accuracy_decimals: 0
    lambda: |-
      auto data = id(ups).get_data();
      if (!data.connected) return NAN;
      return data.rating_voltage;
    update_interval: 60s

# ── Binary Sensors ────────────────────────────────────────────

binary_sensor:
  - platform: template
    name: "UPS Connected"
    id: ups_connected
    device_class: connectivity
    lambda: |-
      return id(ups).get_data().connected;

  - platform: template
    name: "AC Present"
    id: ac_present
    device_class: power
    lambda: |-
      return id(ups).get_data().ac_present;

  - platform: template
    name: "On Battery"
    id: on_battery
    icon: "mdi:battery-alert"
    lambda: |-
      return id(ups).get_data().on_battery;

  - platform: template
    name: "Charging"
    id: charging
    device_class: battery_charging
    lambda: |-
      return id(ups).get_data().charging;

  - platform: template
    name: "Overload"
    id: overload
    device_class: problem
    lambda: |-
      return id(ups).get_data().overload;

  - platform: template
    name: "Battery Low"
    id: battery_low
    device_class: battery
    lambda: |-
      return id(ups).get_data().battery_low_flag;

  - platform: template
    name: "Replace Battery"
    id: replace_battery
    device_class: problem
    lambda: |-
      return id(ups).get_data().replace_battery;

# ── Text Sensors ──────────────────────────────────────────────

text_sensor:
  - platform: template
    name: "UPS Status"
    id: ups_status
    icon: "mdi:power-plug"
    lambda: |-
      auto data = id(ups).get_data();
      if (!data.connected) return std::string("Disconnected");
      switch (data.power_state) {
        case esphome::cyberpower_ups::PowerState::NORMAL: return std::string("Normal");
        case esphome::cyberpower_ups::PowerState::POWER_FAIL_GRACE: return std::string("Power Failure");
        case esphome::cyberpower_ups::PowerState::BATTERY_LOW: return std::string("Battery Low");
        case esphome::cyberpower_ups::PowerState::SHUTDOWN_IMMINENT: return std::string("Shutdown Imminent");
        default: return std::string("Unknown");
      }
    update_interval: 5s

  - platform: template
    name: "UPS Model"
    id: ups_model
    icon: "mdi:information"
    entity_category: diagnostic
    lambda: |-
      auto data = id(ups).get_data();
      return std::string(data.model);
    update_interval: 60s

  - platform: template
    name: "Last Power Event"
    id: last_power_event
    icon: "mdi:lightning-bolt"
    lambda: |-
      auto data = id(ups).get_data();
      return std::string(data.last_event);
    update_interval: 5s

# ── Buttons (NUT-style instant commands) ──────────────────────
# Each button sends a command to the UPS over USB HID (SET_REPORT).
# A command is a no-op if the UPS does not expose the matching report;
# check the ESPHome log or the /log page for "Cmd support: ..." after
# boot to see what YOUR model accepts.
#
# The commands below are SAFE — reversible and with no effect on the
# devices plugged into the UPS. The power-switching commands (reboot /
# load off) are DANGEROUS and live in a commented-out block further down.

button:
  - platform: template
    name: "Beeper Mute"
    icon: "mdi:volume-mute"
    entity_category: config
    on_press:
      - lambda: 'id(ups).queue_command(esphome::cyberpower_ups::UpsCommand::BEEPER_MUTE);'

  - platform: template
    name: "Beeper Enable"
    icon: "mdi:volume-high"
    entity_category: config
    on_press:
      - lambda: 'id(ups).queue_command(esphome::cyberpower_ups::UpsCommand::BEEPER_ENABLE);'

  - platform: template
    name: "Beeper Disable"
    icon: "mdi:volume-off"
    entity_category: config
    on_press:
      - lambda: 'id(ups).queue_command(esphome::cyberpower_ups::UpsCommand::BEEPER_DISABLE);'

  - platform: template
    name: "Battery Test Start"
    icon: "mdi:battery-sync"
    entity_category: diagnostic
    on_press:
      - lambda: 'id(ups).queue_command(esphome::cyberpower_ups::UpsCommand::TEST_BATTERY_START);'

  - platform: template
    name: "Battery Test Stop"
    icon: "mdi:battery-off"
    entity_category: diagnostic
    on_press:
      - lambda: 'id(ups).queue_command(esphome::cyberpower_ups::UpsCommand::TEST_BATTERY_STOP);'

  - platform: template
    name: "Cancel Shutdown"
    icon: "mdi:cancel"
    entity_category: config
    on_press:
      - lambda: 'id(ups).queue_command(esphome::cyberpower_ups::UpsCommand::SHUTDOWN_STOP);'

# ══════════════════════════════════════════════════════════════
#  ⚠️  DANGEROUS COMMANDS — DISABLED BY DEFAULT  ⚠️
# ──────────────────────────────────────────────────────────────
#  The buttons below switch the UPS *output*. Pressing them will
#  cut power to every device plugged into the UPS (your NAS, PC,
#  network gear, …), after a short delay — even while running on
#  mains. There is NO confirmation prompt on the ESPHome entity;
#  the button acts the instant it is pressed or called from an
#  automation.
#
#  Enable them ONLY if you understand the consequences. To do so,
#  remove the '# ' from each line below. It is strongly recommended
#  to also add a confirmation dialog on the Home Assistant dashboard
